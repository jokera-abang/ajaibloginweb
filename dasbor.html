<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajaib</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(180deg,#3f82f8 0%, #0d3685 100%);
    min-height:100vh;
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    min-height:100vh;
    position:relative;
    padding:20px 28px 40px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:100px;
}

.help{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#fff;
    color:#3f82f8;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:600;
}

/* HERO */
.hero{
    margin-top:30px;
    text-align:center;
}

.hero img{
    width:100%;
    max-width:350px;
}

/* TEXT */
.content{
    text-align:center;
    margin-top:15px;
}

.content h1{
    font-size:25px;
    font-weight:700;
    line-height:1.2;
    margin-bottom:8px;
}

.content p{
    font-size:16px;
    line-height:1.7;
    color:#f1f1f1;
}

/* INDICATOR */
.slider{
    margin-top:15px;
    display:flex;
    justify-content:center;
    gap:6px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    border:2px solid white;
}

.active{
    background:white;
}

/* BUTTON */
.buttons{
    margin-top:100px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.btn{
    background:#fff;
    color:#111;
    text-decoration:none;
    height:60px;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    font-size:15px;
    font-weight:500;
}

.icon{
    font-size:40px;
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">
            <img src="https://trade.ajaib.co.id/assets/img_ajaib_tag-B8DgqGC2.png">
        </div>

        <div class="help">?</div>
    </div>

    <div class="hero">
        <img src="https://trade.ajaib.co.id/assets/img_ajaib_products-DDjM1IVE.png" alt="Ajaib Products">
    </div>

    <div class="content">
        <h1>Investasi dengan mudah</h1>

        <p>
            Satu akun untuk semua jenis investasi.
            Apapun asetnya, semua bisa di Ajaib
        </p>

        <div class="slider">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="buttons">

        <a href="Google.html" class="btn">

    <!-- Google SVG -->
    <svg width="30" height="30" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.6 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.7 1.1 7.8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.9-3.1 5.2-6 6.6l6.2 5.2C39 36.7 44 31 44 24c0-1.3-.1-2.4-.4-3.5z"/>
    </svg>

    <span>Masuk/Daftar dengan Google</span>

</a>

<a href="email.html" class="btn">

    <!-- Email SVG -->
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M3 5H21V19H3V5Z" stroke="#111" stroke-width="2"/>
        <path d="M3 7L12 14L21 7" stroke="#111" stroke-width="2"/>
    </svg>

    <span>Masuk/Daftar dengan Email</span>

</a>

    </div>

</div>

</body>
</html>
